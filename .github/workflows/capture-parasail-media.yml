name: Capture The Open Above Media

on:
  push:
    branches: [main]
    paths:
      - tools/capture-parasail-video.mjs
      - .github/workflows/capture-parasail-media.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build production game
        run: npm run build
      - name: Install Chromium for real gameplay
        run: npx playwright install --with-deps chromium
      - name: Record and review sixty-second gameplay
        run: node tools/capture-parasail-video.mjs
      - name: Preserve source, review images, and MP4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: the-open-above-parasail-media-2026-11-06
          path: media/the-open-above-2026-11-06/
          if-no-files-found: error
          retention-days: 30
